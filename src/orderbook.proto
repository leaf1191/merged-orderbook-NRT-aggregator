syntax = "proto3";

package orderbook;

message OrderbookDelta {
  // 호가 레벨 (가격, 수량)
  message Level {
    double price    = 1;
    double quantity = 2;
  }

  string exchange  = 1;  // "bybit", "binance", "okx"
  string instance  = 2;  // "A" / "B"
  string symbol    = 3;  // "BTCUSDT" 등
  int64  seq       = 4;  // 시퀀스 번호
  double event_ts  = 5;  // 이벤트 시간 (초 단위)
  double recv_ts   = 6;  // 수신 시간 (초 단위)

  repeated Level bids = 7; // 매수 호가
  repeated Level asks = 8; // 매도 호가
}